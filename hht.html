<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emissions Calculator - CleanSlate</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="logo-color.png" alt="CleanSlate Logo">
            <span>CleanSlate</span>
        </div>
        <ul>
            <li><a href="impact.html">Home</a></li>
            <li><a href="tt.html">Learn</a></li>
            <li><a href="hht.html">Calculator</a></li>
            <li><a href="resources.html">Resources</a></li>
        </ul>
    </nav>

    <main class="section">
        <div class="container">
            <h2>Coal Mine Emissions Calculator</h2>
            <form id="calculatorForm">
                <section>
                    <h3>Input Data</h3>
                    <div class="form-group">
                        <label for="coalProduction">Coal Production (tons/year):</label>
                        <input type="number" id="coalProduction" name="coalProduction" required placeholder="e.g., 500000">
                    </div>
                    <div class="form-group">
                        <label for="electricityUsage">Grid Electricity Usage (kWh/year):</label>
                        <input type="number" id="electricityUsage" name="electricityUsage" required placeholder="e.g., 1000000">
                    </div>
                     <div class="form-group">
                        <label for="methaneEmissionFactor">Fugitive Methane Emission Factor (m³ CH₄/ton of coal):</label>
                        <input type="number" id="methaneEmissionFactor" name="methaneEmissionFactor" required placeholder="e.g., 15">
                    </div>
                </section>

                <section>
                    <h3>Emission Reduction Technologies</h3>
                     <div class="form-group">
                        <label for="methaneCapturePercentage">Methane Capture Systems (% efficiency):</label>
                        <input type="range" id="methaneCapturePercentage" name="methaneCapturePercentage" min="0" max="95" value="0">
                        <span class="slider-value" id="methaneCaptureValue">0%</span>
                    </div>
                    <div class="form-group">
                        <label for="evAdoptionPercentage">Electric Vehicle (EV) Adoption (% of fleet):</label>
                        <input type="range" id="evAdoptionPercentage" name="evAdoptionPercentage" min="0" max="100" value="0">
                         <span class="slider-value" id="evAdoptionValue">0%</span>
                    </div>
                </section>

                <button type="button" class="btn" onclick="calculateEmissions()">Calculate Emissions</button>
            </form>
        </div>
    </main>

    <section id="results" class="section-light">
        <div class="container">
            <h2>Results</h2>
            <div id="resultSection">
                <p id="result"></p>
                <canvas id="emissionsComparisonChart" width="400" height="200"></canvas>
                <div id="carbonCredits">
                    <h2>Carbon Credits Earned</h2>
                    <p>Total Carbon Credits: <span id="carbonCreditsValue">0</span> credits</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 CleanSlate Emissions Calculator</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="jjt.js"></script>
</body>
</html>
